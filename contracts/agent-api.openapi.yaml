openapi: 3.1.0
info: { title: Virtual Miten Agent Bridge API, version: 1.0.0 }
servers: [{ url: https://agents.orchestraios.com }]
components:
  securitySchemes:
    oidc: { type: openIdConnect, openIdConnectUrl: "${OIDC_ISSUER}/.well-known/openid-configuration" }
  schemas:
    AgentRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { type: string, minLength: 1, maxLength: 16000 }
        stream: { type: boolean, default: true }
        model: { type: string }
        knowledge:
          type: object
          additionalProperties: false
          properties: { query: { type: string, maxLength: 2000 }, topK: { type: integer, minimum: 1, maximum: 10 } }
paths:
  /v1/agent/responses:
    post:
      operationId: createAgentResponse
      security: [{ oidc: [agent:invoke] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentRequest' } } } }
      responses:
        '200': { description: Server-sent event stream, content: { text/event-stream: { schema: { type: string } } } }
        '401': { description: Authentication failed }
        '429': { description: Quota exceeded }
        '504': { description: Timeout }
  /v1/agent/responses/{responseId}:
    delete:
      operationId: cancelAgentResponse
      security: [{ oidc: [agent:cancel] }]
      parameters: [{ name: responseId, in: path, required: true, schema: { type: string } }]
      responses: { '202': { description: Cancellation requested } }
  /mcp:
    post:
      operationId: mcpStreamableHttp
      security: [{ oidc: [mcp:connect] }]
      responses: { '200': { description: MCP JSON-RPC response }, '202': { description: Notification accepted } }
  /health/live:
    get: { responses: { '200': { description: Process is alive } } }
  /health/ready:
    get: { responses: { '200': { description: Dependencies ready }, '503': { description: Dependency degraded } } }
