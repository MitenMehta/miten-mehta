name: Cloudflare Fort Knox Zone Hardening & Drift Detection

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  audit-and-apply:
    name: Audit, Validate & Apply Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Initialize OpenTofu
        working-directory: ./terraform
        run: tofu init -backend=false

      - name: Validate OpenTofu HCL
        working-directory: ./terraform
        run: tofu validate

      - name: Run OpenTofu Plan & Apply
        working-directory: ./terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "[+] Executing live tofu apply..."
            tofu apply -auto-approve -lock=false
          else
            echo "[!] CF_API_TOKEN secret not set. Skipping live tofu apply."
          fi

      - name: Run 22-Point Security Audit
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 scripts/ops/cloudflare_fort_knox_hardening/cloudflare_22_point_live_audit.py

