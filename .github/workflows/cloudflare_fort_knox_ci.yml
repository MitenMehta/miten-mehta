name: Cloudflare Fort Knox Zone Hardening & Drift Detection

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 00:00 UTC to detect configuration drift
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  audit-and-harden:
    name: Audit & Harden Cloudflare Zones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit mitenmehta.com & orchestraios.com
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 scripts/ops/cloudflare_fort_knox_hardening/cloudflare_autonomous_audit.py

      - name: Enforce Zone Hardening (mitenmehta.com)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 scripts/ops/cloudflare_fort_knox_hardening/cloudflare_harden_generic.py --domain mitenmehta.com --force

      - name: Enforce Zone Hardening (orchestraios.com)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 scripts/ops/cloudflare_fort_knox_hardening/cloudflare_harden_generic.py --domain orchestraios.com --force
