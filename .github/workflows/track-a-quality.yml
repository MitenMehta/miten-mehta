name: Track A quality and infrastructure validation

on:
  pull_request:
    branches:
      - integrate/virtual-miten-launch
      - main
  push:
    branches:
      - feature/mitenmehta-launch
      - integrate/virtual-miten-launch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run quality, test, public asset, and build gates
        run: npm run check:full

      - name: Reject high or critical production dependency findings
        run: npm run audit:prod

      - name: Upload immutable website build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.8.1

      - name: Check formatting
        run: tofu fmt -check -recursive terraform/mitenmehta

      - name: Initialize without production state
        working-directory: terraform/mitenmehta
        run: tofu init -backend=false -input=false

      - name: Validate Track A infrastructure
        working-directory: terraform/mitenmehta
        run: tofu validate
